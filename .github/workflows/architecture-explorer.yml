name: Architecture Explorer
on:
  push:
    paths:
      - 'architecture-explorer/**'
      - '.github/workflows/architecture-explorer.yml'
      - 'src/knowledge_os/**'
      - 'tests/**'
      - 'migrations/**'
      - 'config/**'
      - 'prompts/**'
      - 'examples/**'
      - 'docs/**'
      - 'README.md'
      - 'AGENT.md'
      - 'AGENTS.md'
      - 'pyproject.toml'
      - 'uv.lock'
  pull_request:
    paths:
      - 'architecture-explorer/**'
      - '.github/workflows/architecture-explorer.yml'
      - 'src/knowledge_os/**'
      - 'tests/**'
      - 'migrations/**'
      - 'config/**'
      - 'prompts/**'
      - 'examples/**'
      - 'docs/**'
      - 'README.md'
      - 'AGENT.md'
      - 'AGENTS.md'
      - 'pyproject.toml'
      - 'uv.lock'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  drift-and-build:
    permissions:
      contents: read
      pages: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: architecture-explorer
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20.20.1'
          cache: npm
          cache-dependency-path: architecture-explorer/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.13'
      - run: npm ci --no-audit --no-fund
      - name: Check committed metadata and references without rewriting
        run: npm run explorer:check
      - name: Test synchronization and graph behavior
        run: npm test
      - name: Test static Python inspector
        run: |
          python -m pip install pytest==8.4.2 ruff==0.12.12
          python -m pytest -q -p no:cacheprovider -c /dev/null tests/test_inspector.py
          ruff check scripts/inspect_repository.py tests/test_inspector.py
      - run: npm run build
      - name: Exercise browser controls
        run: |
          npx playwright install --with-deps chromium
          npm run test:browser
      - name: Assert checks did not rewrite committed files
        run: git diff --exit-code
      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        uses: actions/configure-pages@v5
      - name: Upload checked static Explorer
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        uses: actions/upload-pages-artifact@v4
        with:
          path: architecture-explorer/dist
  deploy:
    if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    needs: drift-and-build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Architecture Explorer
        id: deployment
        uses: actions/deploy-pages@v4
